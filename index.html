<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taskme</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/skins/skins.css" />
  </head>
  <body data-edge="right" data-blur="on" data-state="closed" data-view="tasks" data-skin="glass">
    <div id="drawer" class="drawer glass">
      <!-- The handle: click = open/close, drag up/down = move along the edge -->
      <div id="tab" class="tab" role="button" aria-label="Open or close Taskme">
        <nav class="tabs" role="tablist">
          <button data-view="tasks" role="tab" aria-label="Tasks">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2.5" width="4" height="4" rx="1.2" /><path d="M3 4.6l.8.8 1.4-1.6M8.5 4.5H14" />
              <rect x="2" y="9.5" width="4" height="4" rx="1.2" /><path d="M8.5 11.5H14" />
            </svg>
          </button>
          <button data-view="notes" role="tab" aria-label="Notes">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3.5 2h6l3 3v9h-9z" /><path d="M9.5 2v3h3M5.5 8h5M5.5 10.5h5M5.5 13h3" />
            </svg>
          </button>
          <button id="full-btn" class="full-btn" aria-pressed="false" aria-label="Full height">
            <svg class="i-grow" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3.5 1.75h9M3.5 14.25h9M8 4v8M5.75 6.25 8 4l2.25 2.25M5.75 9.75 8 12l2.25-2.25" />
            </svg>
            <svg class="i-shrink" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3.5 8h9M8 1.5v4M8 14.5v-4M5.75 3.25 8 5.5l2.25-2.25M5.75 12.75 8 10.5l2.25 2.25" />
            </svg>
          </button>
        </nav>
        <span class="grip"></span>
      </div>

      <section id="panel" class="panel">
        <!-- Resize grips (inner side, top, bottom, and the two inner corners) -->
        <div class="rz rz-side" data-rz="side"></div>
        <div class="rz rz-top" data-rz="top"></div>
        <div class="rz rz-bottom" data-rz="bottom"></div>
        <div class="rz rz-corner rz-corner-top" data-rz="top side"></div>
        <div class="rz rz-corner rz-corner-bottom" data-rz="bottom side"></div>

        <header class="head">
          <h1>Taskme <span id="today" class="today"></span></h1>
          <button id="gear" class="icon-btn" aria-label="Settings">
            <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
              <path d="M10.08 4.85 L10.42 2.53 L13.58 2.53 L13.92 4.85 L15.70 5.59 L17.57 4.18 L19.82 6.43 L18.41 8.30 L19.15 10.08 L21.47 10.42 L21.47 13.58 L19.15 13.92 L18.41 15.70 L19.82 17.57 L17.57 19.82 L15.70 18.41 L13.92 19.15 L13.58 21.47 L10.42 21.47 L10.08 19.15 L8.30 18.41 L6.43 19.82 L4.18 17.57 L5.59 15.70 L4.85 13.92 L2.53 13.58 L2.53 10.42 L4.85 10.08 L5.59 8.30 L4.18 6.43 L6.43 4.18 L8.30 5.59Z" />
              <circle cx="12" cy="12" r="3.3" />
            </svg>
          </button>
        </header>

        <ul id="list" class="list"></ul>

        <div id="notes-view" class="notes-view">
          <ul id="note-list" class="list"></ul>
          <div id="note-editor" class="editor">
            <div class="ed-bar">
              <button id="note-back" class="back">
                <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5" /></svg>
                Notes
              </button>
              <span id="note-stamp" class="stamp"></span>
            </div>
            <textarea id="note-text" class="note-text" spellcheck="false" placeholder="Write something…"></textarea>
          </div>
        </div>

        <div id="settings" class="settings" hidden>
          <div class="row skin-row">
            <span class="label">Skin</span>
            <div id="skin-grid" class="skins" role="radiogroup" aria-label="Skin">
              <button data-skin-id="glass" role="radio" aria-checked="false"><i class="sw sw-glass"></i><span>Glass</span></button>
              <button data-skin-id="win95" role="radio" aria-checked="false"><i class="sw sw-win95"></i><span>Win 95</span></button>
              <button data-skin-id="xp" role="radio" aria-checked="false"><i class="sw sw-xp"></i><span>XP</span></button>
              <button data-skin-id="cyber" role="radio" aria-checked="false"><i class="sw sw-cyber"></i><span>Cyber</span></button>
              <button data-skin-id="matrix" role="radio" aria-checked="false"><i class="sw sw-matrix"></i><span>Matrix</span></button>
              <button data-skin-id="medieval" role="radio" aria-checked="false"><i class="sw sw-medieval"></i><span>Medieval</span></button>
            </div>
          </div>
          <div class="row">
            <span class="label">Edge</span>
            <div id="edge-seg" class="seg" role="group" data-setting="edge">
              <button data-v="left">Left</button>
              <button data-v="right">Right</button>
            </div>
          </div>
          <div id="screen-row" class="row" hidden>
            <span class="label">Screen</span>
            <div id="screen-seg" class="seg" role="group"></div>
          </div>
          <div class="row">
            <span class="label">Start with Windows</span>
            <button id="startup-switch" class="switch" role="switch" aria-checked="false" aria-label="Start with Windows">
              <span class="knob"></span>
            </button>
          </div>
          <div class="row">
            <span class="label">Always on top</span>
            <button id="top-switch" class="switch" role="switch" aria-checked="true" aria-label="Always on top">
              <span class="knob"></span>
            </button>
          </div>
          <div class="row glass-only">
            <span class="label">Blur</span>
            <button id="blur-switch" class="switch" role="switch" aria-checked="true" aria-label="Background blur">
              <span class="knob"></span>
            </button>
          </div>
          <div class="row glass-only">
            <span class="label">Frost</span>
            <input id="frost" class="slider" type="range" min="0" max="100" step="5" />
            <span id="frost-val" class="val"></span>
          </div>
          <p id="blur-note" class="hint glass-only" hidden>Blur isn't available on this version of Windows.</p>
          <button id="quit" class="btn-ghost">Quit Taskme</button>
        </div>

        <div id="toast" class="toast" role="status" hidden>
          <span id="toast-text"></span>
          <button id="undo">Undo</button>
        </div>

        <!-- Right-click popup -->
        <div id="menu" class="menu" role="menu" hidden>
          <button data-act="delete" role="menuitem">
            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/></svg>
            Delete
          </button>
        </div>

        <!-- Date + time picker -->
        <div id="picker" class="picker" role="dialog" aria-label="Deadline" hidden>
          <div class="pk-head">
            <span class="pk-title">Deadline</span>
            <span class="pk-task"></span>
          </div>
          <div class="pk-body">
          <div class="pk-quick">
            <button data-q="today">Today</button>
            <button data-q="tomorrow">Tomorrow</button>
            <button data-q="week">In a week</button>
          </div>
          <div class="pk-month">
            <button class="pk-prev" aria-label="Previous month">‹</button>
            <span class="pk-label"></span>
            <button class="pk-next" aria-label="Next month">›</button>
          </div>
          <div class="pk-dow"><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div>
          <div class="pk-days"></div>
          <div class="pk-time">
            <span class="label">Time</span>
            <input class="pk-h" inputmode="numeric" maxlength="2" aria-label="Hour" />
            <b>:</b>
            <input class="pk-m" inputmode="numeric" maxlength="2" aria-label="Minute" />
          </div>
          </div>
          <div class="pk-actions">
            <button class="pk-clear btn-text danger">Remove</button>
            <span class="spacer"></span>
            <button class="pk-cancel btn-text">Cancel</button>
            <button class="pk-set btn-accent">Set</button>
          </div>
        </div>

        <footer id="foot" class="foot">
          <input id="new-task" class="field" placeholder="Add a task…" autocomplete="off" spellcheck="false" disabled />
          <input id="new-note" class="field" placeholder="Add a note…" autocomplete="off" spellcheck="false" />
          <button id="send" class="send" aria-label="Add" disabled>
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7" /></svg>
          </button>
        </footer>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
